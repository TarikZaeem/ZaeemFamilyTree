<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عائلة مرتجى الزعيم الشيخ</title><script>window.onerror=function(m,u,l,c){try{var d=document.createElement("div");d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:999;background:#b00020;color:#fff;padding:8px 12px;font:13px sans-serif;direction:ltr";d.textContent="Error: "+m+" (line "+l+")";(document.body||document.documentElement).appendChild(d)}catch(e){}};</script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600&amp;display=swap"><style>
/* Layout: horizontal tree, grandfather on the right, each generation one column to the left.

:root{

  --g2-bg:#2f6d55; --g2-fg:#ffffff;

  --line:#2b3832; --branch:#80725f; --accent:#e5806a; --accent-ink:#1d0d08; --hit:#f0b84a; --ok:#52a583; --ok-ink:#0e211a; --bad:#e5806a; --bad-ink:#1d0d08;
  --g0-bg:#d3b48f; --g0-fg:#261b12;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:14px}
.credit{flex:none;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;line-height:1.7;color:var(--muted)}
.credit p{margin:0 0 4px}
.credit b{color:var(--ink)}
.credit a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.credit .ph{direction:ltr;unicode-bidi:isolate;display:inline-block}
.credit.in{margin-top:16px}
.credit.in p{text-align:justify;text-justify:inter-word}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{min-width:0}
h1{margin:0;font-family:'Aref Ruqaa','Noto Naskh Arabic',serif;font-weight:700;font-size:30px;line-height:1.2}
.stats{margin:0;display:flex;gap:14px;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.search{position:relative;display:block}
.search input{width:190px;max-width:100%;padding:7px 12px;padding-inline-end:70px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.qnav{display:inline-flex;gap:4px}.qnav[hidden]{display:none}.qnav button{white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;font:inherit;font-size:13px;cursor:pointer}.qnav button:hover{border-color:var(--muted)}
.qcount{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.grp{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.grp button{border:0;background:transparent;padding:7px 12px;font-size:13px;white-space:nowrap}
.grp button+button{border-inline-start:1px solid var(--line)}
.grp button:hover{background:var(--canvas)}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}
.viewport{position:relative;min-width:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;direction:ltr}
.viewport.grab{cursor:grabbing;user-select:none}
.sizer{position:relative;min-width:100%}
.stage{position:absolute;top:0;right:0;transform-origin:top right}
.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
.e{fill:none;stroke:var(--branch);stroke-width:2.2;stroke-linecap:round}
.e.on{stroke:var(--accent);stroke-width:3}
.node{position:absolute;width:128px;height:36px;display:flex;align-items:center;justify-content:center;padding:0 8px;border:0;border-radius:18px 4px 18px 4px;
  background:var(--bg);color:var(--fg);font-family:'Aref Ruqaa','Noto Naskh Arabic',serif;font-weight:700;font-size:17px;line-height:1.1;white-space:nowrap;direction:rtl;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.node.long{font-size:14px}
.node.xl{font-size:12px;white-space:normal}
.node:hover{filter:brightness(1.07)}
.node.hit{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--hit)}
.node.sel{box-shadow:0 0 0 3px var(--canvas),0 0 0 5px var(--accent)}
.tog{position:absolute;transform:translate(-50%,-50%);z-index:2;min-width:22px;height:22px;padding:0 5px;border-radius:11px;border:2px solid var(--branch);background:var(--surface);color:var(--ink);font-size:11px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tog::after{content:"";position:absolute;inset:-8px}
.tog:hover{border-color:var(--accent)}
.g0{--bg:var(--g0-bg);--fg:var(--g0-fg)}.g1{--bg:var(--g1-bg);--fg:var(--g1-fg)}.g2{--bg:var(--g2-bg);--fg:var(--g2-fg)}.g3{--bg:var(--g3-bg);--fg:var(--g3-fg)}
.g4{--bg:var(--g4-bg);--fg:var(--g4-fg)}.g5{--bg:var(--g5-bg);--fg:var(--g5-fg)}.g6{--bg:var(--g6-bg);--fg:var(--g6-fg)}.g7{--bg:var(--g7-bg);--fg:var(--g7-fg)}
.gx{--bg:color-mix(in oklab,var(--ga),var(--gb) calc(var(--t)*100%));--fg:var(--fa)}
.gx.tl{--fg:var(--fb)}

.empty{position:sticky;top:0;left:0;z-index:3;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;direction:rtl;text-align:center}
.empty[hidden]{display:none}
.empty .card{max-width:340px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.empty h2{margin:0;font-family:'Aref Ruqaa',serif;font-size:26px}
.empty p{margin:0;color:var(--muted)}

.panel{min-width:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gen{display:inline-block;padding:2px 12px;border-radius:12px 3px 12px 3px;background:var(--bg);color:var(--fg);font-size:12px;font-weight:600}
.x{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:18px;line-height:1}
.pname{margin:0;font-family:'Aref Ruqaa',serif;font-size:30px;line-height:1.25;overflow-wrap:anywhere}
.nasab{margin:-6px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.facts div{padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.add label{display:block;margin-bottom:6px;font-weight:600}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--canvas)}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;white-space:nowrap}
.btn:hover{background:var(--canvas)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.danger.solid{background:var(--accent);color:var(--accent-ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.hint{margin:0;color:var(--muted);font-size:13px}
.flash{margin:0;color:var(--muted);font-size:13px;min-height:1.5em}
.confirm p{margin:0 0 10px}
.legend{display:flex;gap:4px;margin-top:2px}
.sw{flex:1;height:14px;border-radius:7px 2px 7px 2px;background:var(--bg)}
.legend-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.foot{margin:auto 0 0;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

.sect{display:flex;align-items:center;justify-content:space-between;margin-bottom:-6px}
.sect h3{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.link{border:0;background:transparent;padding:2px 0;color:var(--accent);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}
.info dt{padding-top:2px;font-size:12px;color:var(--muted)}
.info dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.na{color:var(--muted);font-size:13px}
.counts{margin:0;color:var(--muted);font-size:13px}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums}
.cardform{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}
.field label{display:block;margin-bottom:4px;font-size:13px;font-weight:600}
.field textarea{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);line-height:1.7;resize:vertical;min-height:90px}
.bio{margin:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}
.bio h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.bio p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;text-align:justify}
.field input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.node.dead{filter:saturate(.5);outline:1.5px dotted var(--fg);outline-offset:-4px}
.node.dead:hover{filter:saturate(.5) brightness(1.07)}
.tip{position:fixed;z-index:50;width:max-content;min-width:180px;max-width:min(270px,calc(100vw - 24px));padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.24);pointer-events:none;direction:rtl;font-size:13px;display:flex;flex-direction:column;gap:6px}
.tip[hidden]{display:none}
.tip .tn{font-family:'Aref Ruqaa','Noto Naskh Arabic',serif;font-size:22px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.tip .tl{margin:0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;padding-top:6px;border-top:1px solid var(--line)}
.tip dt{color:var(--muted);font-size:12px}
.tip dd{margin:0;overflow-wrap:anywhere}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,13,.55)}
.sheet-box{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 16px 48px rgba(0,0,0,.35)}
.sheet-box h2{margin:0;font-family:'Aref Ruqaa','Noto Naskh Arabic',serif;font-size:30px;line-height:1.25;overflow-wrap:anywhere}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.origin{margin:-8px 0 0;color:var(--muted);text-align:center}
#aboutT{flex:1;text-align:center;padding-inline-start:36px}
.abouttext{margin:0;text-align:justify;text-justify:inter-word;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch;line-height:1.8}
.astats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:0}
.astats div{padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.astats dt{font-size:12px;color:var(--muted)}
.astats dd{margin:0;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.places h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.places ul{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.places li{padding:3px 12px;border:1px solid var(--line);border-radius:12px 3px 12px 3px;background:var(--canvas)}
.places li b{font-variant-numeric:tabular-nums;margin-inline-start:6px;color:var(--muted);font-weight:600}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;width:fit-content;max-width:min(520px,calc(100vw - 32px));margin-inline:auto;padding:12px 20px;border-radius:14px 4px 14px 4px;font-weight:600;font-size:15px;line-height:1.5;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.3);pointer-events:none;direction:rtl}
.toast[hidden]{display:none}
.toast.ok{background:var(--ok);color:var(--ok-ink)}
.toast.err{background:var(--bad);color:var(--bad-ink)}
.xsec{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}
.xsec h3{margin:0;font-size:14px;font-weight:600}
.xsec .hint{margin:0}
.btn:disabled,.grp button:disabled{opacity:.55;cursor:default}
.grp button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.aform{display:flex;flex-direction:column;gap:12px}
.aform textarea{width:100%;min-height:160px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);resize:vertical;line-height:1.7}
.aform input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--canvas)}
.mbar{display:none}
.cr>summary{cursor:pointer;list-style:none;font-weight:600;color:var(--ink)}
.cr>summary::-webkit-details-marker{display:none}
.cr>summary::after{content:" ▾";color:var(--muted)}
.cr[open]>summary::after{content:" ▴"}
@media (min-width:761px){.cr>summary{display:none}}
@media (max-width:760px){
  .app{padding-inline:10px;padding-block:8px;gap:8px}
  .top{position:relative;flex-wrap:nowrap;gap:8px}
  h1{font-size:18px}
  .stats{font-size:12px;gap:10px}
  .mbar{display:flex;gap:6px;flex:none}
  .mbar button{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;cursor:pointer}
  .mbar button[aria-expanded=true]{background:var(--canvas);border-color:var(--muted)}
  .tools{display:none}
  .top.s-search .tools,.top.s-menu .tools{display:flex}
  .top.s-search .tools{position:absolute;top:100%;inset-inline:0;margin-top:6px;z-index:30;flex-wrap:nowrap;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .top.s-search .tools .grp,.top.s-menu .tools .search,.top.s-menu .tools .qnav{display:none}
  .top.s-search .search{flex:1 1 auto}
  .top.s-search .search input{width:100%;font-size:16px}
  .top.s-menu .tools{position:absolute;top:100%;inset-inline-start:0;width:min(280px,100%);margin-top:6px;z-index:30;flex-direction:column;align-items:stretch;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .top.s-menu .grp button{flex:1;padding:11px 12px;font-size:14px}
  .work{display:flex;flex-direction:column;gap:8px}
  .viewport{flex:1;min-height:0}
  .panel{flex:none}
  .panel.idle{display:none}
  .panel:not(.idle){position:fixed;z-index:60;inset-inline:12px;top:50%;transform:translateY(-50%);max-height:78vh;box-shadow:0 0 0 100vmax rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.35)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

function startDb(db){

    add:function(name,parent,order){return col.add({name:name,parent:parent,order:order})},

    put:function(id,data){return col.doc(id).set(data)},

  try{var raw=JSON.parse(localStorage.getItem(KEY)||'{}');people={};Object.keys(raw).forEach(function(id){if(raw[id]&&typeof raw[id].name==='string')people[id]=normDoc(id,raw[id])})}catch(e){people={}}

    rename:function(id,name){if(people[id])people[id].name=name;save();return Promise.resolve()},

    addParent:function(childId,name){var id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);people[id]={name:name,parent:'',order:Date.now()};if(people[childId])people[childId].parent=id;save();return Promise.resolve(id)},

  var cr=$('#credit');if(cr){var mob=window.matchMedia&&window.matchMedia('(max-width:760px)').matches;cr.innerHTML='<details class="cr"'+(mob?'':' open')+'><summary>تنويه وتواصل</summary>'+creditHtml()+'</details>';cr.hidden=false}
  /* the shared file opens with every branch folded: the grandfather and his sons, nothing deeper */
  index();collapsed=new Set();Object.keys(people).forEach(function(id){if((kids[id]||[]).length&&depthOf(id)>=1)collapsed.add(id)});
  loaded=true;panelKey='';emptyKey='';refresh();
}
function begin(){
  if(VIEW){
    started=true;
    /* a data.json sitting next to this page (same site) overrides the data baked into the file */
    var live=(window.fetch&&/^https?:/.test(location.protocol))?Promise.race([
      fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}),
      new Promise(function(res){setTimeout(function(){res(null)},6000)})
    ]).catch(function(){return null}):Promise.resolve(null);
    live.then(function(d){
      if(d&&d.people&&typeof d.people==='object'&&Object.keys(d.people).length){VIEW={people:d.people,about:d.about||VIEW.about}}
    }).then(startView,startView);
    return;
  }
  var use=(window.claude&&window.claude.use)?function(n){return window.claude.use(n)}:function(){return Promise.resolve(null)};
  var timer=setTimeout(function(){if(!started){started=true;startLocal()}},4000);
  use('db').then(function(db){
    clearTimeout(timer);
    if(db){started=true;startDb(db)}else if(!started){started=true;startLocal()}
  }).catch(function(){clearTimeout(timer);if(!started){started=true;startLocal()}});
  use('user').then(function(u){
    if(!u||!u.can)return;
    return u.can('data.write').then(function(v){if(v===false){canWrite=false;panelKey='';emptyKey='';refresh()}});
  }).catch(function(){});
}
refresh();
begin();
})();
</script></body></html>
